services:
  rate-limiter:
    container_name: ratelimit-service
    build:
      context: .
      dockerfile: ./docker/Dockerfile

    restart: unless-stopped

    ports:
      - ${APP_SERVER_PORT}:49105
      - ${APP_HTTP_PORT}:8090
    volumes:
      - ${APP_CONFIG_PATH}:/app/config.toml:ro
      # - ./data:/data

    env_file:
      - .env

    logging:
      driver: "json-file"
      options:
        max-size: "1m"   # Max size of a log file
        max-file: "10"     # Max files of logs
        compress: "true"  # Compress olf log files

    networks:
      - rate-limiter-network

networks:
  rate-limiter-network:
    driver: bridge
